# Builds the Windows installer and zip on GitHub's Windows machines.
# Push a tag like v1.0.3 to publish a release, or run it by hand from the Actions tab.
name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --x64 --publish never

      - name: Attach installer and zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip

      - name: Keep the build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: offbeat-windows
          path: |
            dist/*.exe
            dist/*.zip
